        document.getElementById('jsonInput').value = JSON.stringify(initialData, null, 4);

        function updatePlot() {
            const jsonData = JSON.parse(document.getElementById('jsonInput').value);
            const stars = jsonData.stars;
            const wormholes = jsonData.wormholes;

            const starTraces = stars.map(star => ({
                x: [star.x],
                y: [star.y],
                mode: 'markers',
                marker: {
                    color: star.puid ? `rgb(${Math.random() * 255}, ${Math.random() * 255}, ${Math.random() * 255})` : 'white',
                    size: 10,
                    symbol: 'star'
                },
                text: `Index: ${star.uid}, Name: ${star.name}, Resources: ${star.r}, G: ${star.g}, E: ${star.e}, I: ${star.i}, S: ${star.s}, ST: ${star.st}`,
                hoverinfo: 'text',
                name: star.puid ? `Player ${star.puid}` : star.name,
                showlegend: true
            }));

            const wormholeTraces = wormholes.map(pair => {
                const star1 = stars.find(star => star.uid === pair[0]);
                const star2 = stars.find(star => star.uid === pair[1]);
                return {
                    x: [star1.x, star2.x],
                    y: [star1.y, star2.y],
                    mode: 'lines+markers',
                    marker: {
                        color: 'red',
                        size: 5
                    },
                    line: {
                        color: 'red'
                    },
                    name: 'Wormholes',
                    showlegend: true
                };
            });

            const data = [...starTraces, ...wormholeTraces];

            const layout = {
                title: {
                    text: 'Galaxy Map',
                    x: 0.5,
                    xanchor: 'center'
                },
                xaxis: {
                    title: 'X Coordinate',
                    showgrid: false,
                    zeroline: false
                },
                yaxis: {
                    title: 'Y Coordinate',
                    showgrid: false,
                    zeroline: false
                },
                plot_bgcolor: '#202735',
                legend: {
                    bgcolor: '#000',  // Set legend background color to black
                    font: {
                        color: 'white'  // Set legend text color to white
                    }
                },
                showlegend: true,
                hovermode: 'closest'  // Ensure tooltips are shown individually
            };

            Plotly.newPlot('plot', data, layout);
        }

        updatePlot();
